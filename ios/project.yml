# XcodeGen spec for the iPhone and iPad app. Generate the Xcode project with:
#   cd ios && xcodegen generate
# SafeTube.xcodeproj is generated, so it isn't committed; edit this file instead.
name: SafeTube
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "7"
packages:
  SafeTubeCore:
    path: SafeTubeCore
targets:
  SafeTube:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: SafeTube
      # Shared with the Android app, referenced in place (not copied into ios/), so both apps
      # always build with the same page filter and parent screens.
      - path: ../app/src/main/assets/filter.js
        buildPhase: resources
      - path: ../app/src/main/assets/parent
        type: folder
        buildPhase: resources
    dependencies:
      - package: SafeTubeCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: SafeTube/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
    info:
      path: SafeTube/Info.plist
      properties:
        CFBundleDisplayName: SafeTube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        # Long-press the app icon: "Parent settings" (still asks for the PIN).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.safetube.parent
            UIApplicationShortcutItemTitle: Parent settings
            UIApplicationShortcutItemIconSymbolName: lock
        # A home server (Ollama, LM Studio) can be the video checker.
        NSLocalNetworkUsageDescription: SafeTube can use an AI model running on your home network to check videos, if you set one up.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
