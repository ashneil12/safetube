name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: SKIP_ANDROID=1 ./gradlew :core:test

  page-filter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/filter-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node run.js

  apk:
    runs-on: ubuntu-latest
    needs: [engine-tests, page-filter-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SAFETUBE_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SAFETUBE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          SAFETUBE_KEYSTORE_PASSWORD: ${{ secrets.SAFETUBE_KEYSTORE_PASSWORD }}
          SAFETUBE_KEY_ALIAS: ${{ secrets.SAFETUBE_KEY_ALIAS }}
          SAFETUBE_KEY_PASSWORD: ${{ secrets.SAFETUBE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "SafeTube-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SafeTube-apk
          path: SafeTube-*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SafeTube-*.apk
          generate_release_notes: true
