name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: SKIP_ANDROID=1 ./gradlew :core:test

  page-filter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/filter-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node run.js
      - run: node ../parent-test/run.js

  apk:
    runs-on: ubuntu-latest
    needs: [engine-tests, page-filter-tests]
    # The same key must sign every build, or Android refuses to install an update over the old
    # app. Job-level so the step's `if` can see it (a step can't read its own env in `if`).
    env:
      KEYSTORE_B64: ${{ secrets.SAFETUBE_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key (optional)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SAFETUBE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          SAFETUBE_KEYSTORE_PASSWORD: ${{ secrets.SAFETUBE_KEYSTORE_PASSWORD }}
          SAFETUBE_KEY_ALIAS: ${{ secrets.SAFETUBE_KEY_ALIAS }}
          SAFETUBE_KEY_PASSWORD: ${{ secrets.SAFETUBE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "SafeTube-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SafeTube-apk
          path: SafeTube-*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests (Swift port)
        run: swift test --package-path ios/SafeTubeCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild -project SafeTube.xcodeproj -scheme SafeTube -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/SafeTube.app Payload/
          test -f Payload/SafeTube.app/filter.js
          test -f Payload/SafeTube.app/parent/index.html
          zip -qry "SafeTube-${GITHUB_REF_NAME//\//-}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SafeTube-ipa
          path: SafeTube-*.ipa

  # Publishing waits for both apps so the release always has a matching APK and IPA.
  # Never runs for pull requests.
  publish:
    runs-on: ubuntu-latest
    needs: [apk, ios]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SafeTube-*
          merge-multiple: true
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SafeTube-*.apk
            SafeTube-*.ipa
          generate_release_notes: true
      - name: Publish latest build from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp SafeTube-main.apk SafeTube.apk
          cp SafeTube-main.ipa SafeTube.ipa
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SafeTube.apk SafeTube.ipa --target "$GITHUB_SHA" --latest \
            --title "SafeTube (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on main. SafeTube.apk is for Android and Fire tablets: open it on the tablet. SafeTube.ipa is for iPhone and iPad: install it with Sideloadly or AltStore (see the README)."
