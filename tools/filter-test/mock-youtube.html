<!doctype html>
<!-- A stripped-down copy of m.youtube.com's markup, enough to exercise filter.js. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube</title>
<style>
  body { font-family: Roboto, Arial, sans-serif; margin: 0; background: #fff; }
  header { padding: 12px 16px; font-weight: bold; color: #c4302b; font-size: 20px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 16px; }
  ytm-rich-item-renderer, ytm-media-item, ytm-reel-shelf-renderer { display: block; }
  .thumb { height: 120px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; }
  h3 { font-size: 15px; margin: 8px 0 2px; }
  .media-item-byline { color: #606060; font-size: 13px; }
  ytm-reel-shelf-renderer, ytm-comment-section-renderer, ytm-promoted-video-renderer { display: block; margin: 16px; padding: 12px; background: #eee; }
  #player { display: block; margin: 16px; height: 180px; background: #000; color: #fff; }
</style>
</head>
<body>
<header>YouTube (mock)</header>
<div id="grid"></div>
<ytm-reel-shelf-renderer id="shorts">Shorts shelf <a href="/shorts/SHORTS00001">a short</a></ytm-reel-shelf-renderer>
<ytm-promoted-video-renderer id="ad">Sponsored: buy stuff</ytm-promoted-video-renderer>
<ytm-comment-section-renderer id="comments">Comments: random strangers</ytm-comment-section-renderer>
<p id="loose">Loose link outside any card: <a id="looseLink" href="/watch?v=HALLOWEEN02">Spooky stuff</a></p>
<div id="player"><video id="vid" muted></video>player</div>
<script>
  window.makeCard = function (id, title, channel, color) {
    var el = document.createElement('ytm-rich-item-renderer');
    el.id = 'card-' + id;
    el.innerHTML =
      '<ytm-media-item><a class="media-item-thumbnail-container" href="/watch?v=' + id + '">' +
      '<div class="thumb" style="background:' + color + '">▶</div></a>' +
      '<a href="/watch?v=' + id + '"><h3 class="media-item-headline">' + title + '</h3></a>' +
      '<div class="media-item-byline">' + channel + '</div></ytm-media-item>';
    return el;
  };
  var grid = document.getElementById('grid');
  [
    ['WHEELSBUS01', 'Wheels On The Bus | Kids Songs', 'Super Simple Songs', '#2e7d32'],
    ['HALLOWEEN01', 'Five Little Pumpkins | Halloween Song', 'Super Simple Songs', '#e65100'],
    ['BABYSHARK01', 'Baby Shark Dance', 'Pinkfong', '#1565c0'],
    ['WITCHBREW01', 'Witches Brew | Spooky Song for Kids', 'Super Simple Songs', '#6a1b9a'],
    ['NUMBERS0001', 'Numberblocks - Learn to Count', 'Numberblocks', '#c62828'],
    ['MYSTERY0001', 'Super Simple Songs Compilation #14', 'Super Simple Songs', '#455a64']
  ].forEach(function (v) { grid.appendChild(makeCard(v[0], v[1], v[2], v[3])); });
</script>
</body>
</html>
